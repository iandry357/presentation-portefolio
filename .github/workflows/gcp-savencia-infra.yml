name: GCP Savencia Infra — Terraform

on:
  push:
    branches:
      - main
      - infra-scaleway-v1.1
      - feature/realisations-savencia
    paths:
      - 'gcp/savencia/infra/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gcp/savencia/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_SAVENCIA }}

      - name: Write terraform.tfvars
        run: echo '${{ secrets.TF_VARS_FILE_SAVENCIA }}' > terraform.tfvars

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve