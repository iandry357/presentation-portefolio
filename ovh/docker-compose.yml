services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: ovh-orchestrator
    ports:
      - "8080:8080"
    volumes:
      - ./orchestrator/registry.yaml:/app/registry.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/ml-project:/home/ubuntu/ml-project:ro
    networks:
      - portefolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  portefolio-network:
    external: true