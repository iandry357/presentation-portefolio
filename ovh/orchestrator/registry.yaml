services:

  # --- ALWAYS-ON : ne jamais toucher ---

  chromadb:
    container_name: portefolio-chromadb
    mvp: global
    port: 8000
    priority: always-on
    ram_mb: 400
    compose_file: /home/ubuntu/chromadb/docker-compose.yml
    compose_service: chromadb

  # --- ON-DEMAND : démarrés sur signal, éteints après inactivité ---

  sanofi-ml:
    container_name: ml_ml-service_1
    mvp: sanofi
    port: 8001
    priority: on-demand
    ram_mb: 800
    compose_file: /home/ubuntu/ml-project/realisations/sanofi/ml/docker-compose.yml
    compose_service: ml-service

  savencia-ml:
    container_name: ml_savencia-ml-service_1
    mvp: savencia
    port: 8002
    priority: on-demand
    ram_mb: 600
    compose_file: /home/ubuntu/ml-project/realisations/savencia/ml/docker-compose.yml
    compose_service: savencia-ml-service

  sg-ml:
    container_name: sg-ml-service
    mvp: sg
    port: 8003
    priority: on-demand
    ram_mb: 700
    compose_file: /home/ubuntu/ml-project/realisations/sg/sg-assurances/ml/docker-compose.yml
    compose_service: ml-service

  embedding-service:
    container_name: embedding-service
    mvp: shared
    port: 8004
    priority: on-demand
    ram_mb: 500
    compose_file: /home/ubuntu/ml-project/realisations/sg/sg-assurances/embedding-service/docker-compose.yml
    compose_service: embedding-service

  banque-ml:
    container_name: banque-ml-service
    mvp: banque-de-france
    port: 8007
    priority: on-demand
    ram_mb: 700
    compose_file: /home/ubuntu/ml-project/realisations/banque-de-france/ml/docker-compose.yml
    compose_service: ml-service
    
  gestion-patrimoine-ml:
    container_name: gestion-patrimoine-ml
    mvp: gestion-patrimoine
    port: 8008
    priority: on-demand
    ram_mb: 300
    compose_file: /home/ubuntu/ml-project/realisations/gestion-patrimoine/ml/docker-compose.yml
    compose_service: ml-service

  neo4j:
    container_name: sanofi-neo4j
    mvp: sanofi
    port: 7474
    priority: on-demand
    ram_mb: 900
    compose_file: /home/ubuntu/ml-project/realisations/sanofi/ml/docker-compose.yml
    compose_service: neo4j